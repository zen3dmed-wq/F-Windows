name: Flint Android Stable

on:
  push:
    branches:
      - flint-android-stable
    paths:
      - '.github/workflows/flint-android-stable.yml'
      - 'android/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'Makefile'
      - 'dependencies.properties'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.38.5'
  APP_CHANNEL: 'dev'
  IS_GITHUB_ACTIONS: '1'

jobs:
  build-and-launch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: flint-android-stable

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"
          dart pub global activate fastforge
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Generate temporary Flint signing key
        shell: bash
        run: |
          set -euxo pipefail
          keytool -genkeypair -v \
            -keystore android/flint-test.jks \
            -storepass flinttest123 \
            -keypass flinttest123 \
            -alias flint \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Flint Android Test,O=Flint,C=RU"
          cat > android/key.properties <<'EOF'
          storePassword=flinttest123
          keyPassword=flinttest123
          keyAlias=flint
          storeFile=flint-test.jks
          EOF

      - name: Prepare Android
        shell: bash
        run: |
          set -euxo pipefail
          CHANNEL=dev make android-apk-prepare

      - name: Build release APKs
        shell: bash
        run: |
          set -euxo pipefail
          flutter build apk \
            --release \
            --target lib/main.dart \
            --target-platform android-arm64,android-x64 \
            --split-per-abi \
            --dart-define=sentry_dsn=
          ls -lh build/app/outputs/flutter-apk/
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/Flint-Android-8.9.10-arm64.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk out/Flint-Android-8.9.10-x86_64.apk

      - name: Verify ARM64 APK signature and identity
        shell: bash
        run: |
          set -euxo pipefail
          APK=out/Flint-Android-8.9.10-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee out/aapt-badging.txt
          grep -F "application-label:'Flint'" out/aapt-badging.txt
          grep -F "versionName='8.9.10'" out/aapt-badging.txt
          unzip -t "$APK"
          sha256sum "$APK" | tee out/Flint-Android-8.9.10-arm64.apk.sha256

      - name: Boot emulator, install, and launch Flint
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euxo pipefail
            APK=out/Flint-Android-8.9.10-x86_64.apk
            adb install -r "$APK"
            adb logcat -c
            adb shell monkey -p app.hiddify.com -c android.intent.category.LAUNCHER 1
            sleep 12
            PID="$(adb shell pidof app.hiddify.com | tr -d '\r' || true)"
            echo "PID=$PID"
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
            adb logcat -d > out/launch-logcat.txt
            if [ -z "$PID" ]; then
              echo "Flint process is not alive after launch"
              tail -n 250 out/launch-logcat.txt
              exit 1
            fi
            if grep -E "FATAL EXCEPTION|Process: app.hiddify.com.*has died" out/launch-logcat.txt; then
              echo "Fatal Android crash detected"
              tail -n 250 out/launch-logcat.txt
              exit 1
            fi
            adb exec-out screencap -p > out/flint-launch.png
            echo "FLINT_LAUNCH_OK"

      - name: Upload tested Flint APK
        uses: actions/upload-artifact@v4
        with:
          name: Flint-Android-8.9.10-TESTED
          path: |
            out/Flint-Android-8.9.10-arm64.apk
            out/Flint-Android-8.9.10-arm64.apk.sha256
            out/aapt-badging.txt
            out/launch-logcat.txt
            out/flint-launch.png
          retention-days: 7
